name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Mastorss moved to the curator; all that's left here is the redirect page.
      - name: Redirect page present
        run: grep -q "curator.8bitcloud.com" index.html
