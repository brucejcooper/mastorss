name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: End-to-end test
        run: |
          npx http-server -p 8123 -c-1 -s . &
          for i in $(seq 30); do curl -sf http://localhost:8123/ >/dev/null && break; sleep 1; done
          node test/e2e.mjs
