name: Deploy to GitHub Pages

# Publishes main to https://brucejcooper.github.io/mastorss/ once CI has
# passed on it. There's a single deployment: changes go straight to main.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html styles.css sw.js manifest.webmanifest js icons _site/
          # Lets a running app notice a new deploy and reload itself, and
          # shows in Settings as the version.
          echo "{\"version\":\"$(git rev-parse HEAD)\",\"built\":\"$(git log -1 --format=%cI)\"}" > _site/version.json
          cat _site/version.json
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
      - id: deployment
        uses: actions/deploy-pages@v5
