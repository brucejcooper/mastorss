name: Deploy to GitHub Pages

# Publishes two copies of the app to one Pages site:
#   /mastorss/       prod, from main (the one installed on the phone)
#   /mastorss/test/  test, from the development branch
# It runs after CI passes on either branch. workflow_run jobs run in the
# context of the default branch, which is what the github-pages environment
# allows to deploy, so pushes to the development branch can update test
# without touching main.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, claude/mastodon-rss-reader-4k8ebl]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  TEST_BRANCH: claude/mastodon-rss-reader-4k8ebl

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          path: prod
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TEST_BRANCH }}
          path: test
      - name: Assemble site
        run: |
          files="index.html styles.css sw.js manifest.webmanifest js icons"
          mkdir -p _site/test
          (cd prod && cp -r $files ../_site/)
          (cd test && cp -r $files ../_site/test/)
          # Make the test copy easy to tell apart, including on the home screen.
          sed -i 's/<html lang="en">/<html lang="en" data-env="test">/; s#<title>Mastorss</title>#<title>Mastorss Test</title>#; s/content="Mastorss">/content="Mastorss Test">/' _site/test/index.html
          sed -i 's/"name": "Mastorss"/"name": "Mastorss Test"/; s/"short_name": "Mastorss"/"short_name": "Mastorss Test"/' _site/test/manifest.webmanifest
          # Lets a running app notice a new deploy and reload itself.
          echo "{\"version\":\"$(git -C prod rev-parse HEAD)\"}" > _site/version.json
          echo "{\"version\":\"$(git -C test rev-parse HEAD)\"}" > _site/test/version.json
          echo "prod: $(git -C prod rev-parse --short HEAD)  test: $(git -C test rev-parse --short HEAD)"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
      - id: deployment
        uses: actions/deploy-pages@v5
