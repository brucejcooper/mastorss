name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/mastodon-rss-reader-4k8ebl]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: End-to-end test
        run: |
          npx http-server -p 8123 -c-1 -s . &
          for i in $(seq 30); do curl -sf http://localhost:8123/ >/dev/null && break; sleep 1; done
          node test/e2e.mjs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html styles.css sw.js manifest.webmanifest js icons _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
