<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Mastorss has moved</title>
  <meta http-equiv="refresh" content="3; url=https://curator.8bitcloud.com/">
  <style>
    body { font: 17px/1.5 system-ui, sans-serif; margin: 0; padding: 2rem 16px; max-width: 32rem; margin-inline: auto; background: #f6f5f2; color: #1d1d1f; }
    @media (prefers-color-scheme: dark) { body { background: #16171b; color: #ececf1; } a { color: #8f86ff; } }
    a { color: #5b4fd6; }
  </style>
</head>
<body>
  <h1>Mastorss has moved</h1>
  <p>It now lives at <a href="https://curator.8bitcloud.com/">curator.8bitcloud.com</a>, where you sign in with Mechination.
     Taking you there…</p>
  <p>If you added this page to your home screen, add the new address instead.</p>
  <script>
    // Tidy up after the old app: its service worker, its cache, and what it
    // kept in this (shared github.io) storage, including its Mastodon login.
    try {
      Object.keys(localStorage).filter((k) => k.startsWith('mastorss.')).forEach((k) => localStorage.removeItem(k));
    } catch {}
    navigator.serviceWorker?.getRegistrations().then((rs) => rs.forEach((r) => r.unregister())).catch(() => {});
    caches?.keys().then((ks) => ks.filter((k) => k.startsWith('mastorss')).forEach((k) => caches.delete(k))).catch(() => {});
    setTimeout(() => location.replace('https://curator.8bitcloud.com/'), 1500);
  </script>
</body>
</html>
