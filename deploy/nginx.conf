server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Small files: always revalidate so updates show up straight away.
    # Remote post HTML is sanitised in the app; the CSP is a second line of
    # defence. Images/media load from anywhere, API calls go out over HTTPS.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src * data: blob:; media-src * blob:; connect-src 'self' https: wss:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri $uri/ /index.html;
    }
}
